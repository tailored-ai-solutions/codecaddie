name: Reconcile forward-only stable release

on:
  workflow_call:
    inputs:
      tag:
        description: Verified stable draft tag to publish
        required: true
        type: string

permissions:
  attestations: read
  contents: write

# Each stable draft crosses GitHub's one-way immutable publication boundary
# while holding this FIFO repository-wide lease. Latest is selected in that
# same publication request, so an older run can publish but cannot regress it.
concurrency:
  group: codecaddie-stable-publication
  queue: max
  cancel-in-progress: false

env:
  CANONICAL_REPOSITORY: tailored-ai-solutions/codecaddie

jobs:
  reconcile:
    name: Publish stable draft at the verified high-water mark
    if: github.repository == 'tailored-ai-solutions/codecaddie' && github.ref == 'refs/heads/main'
    environment:
      name: release-production
      url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Fail closed outside the pinned public repository
        env:
          ACTUAL_REPOSITORY_ID: ${{ github.repository_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY"
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]
          configured_repository="$(jq -er .sigstore.repository config/release-trust.json)"
          configured_repository_id="$(jq -er .sigstore.repositoryId config/release-trust.json)"
          test "$configured_repository" = "$CANONICAL_REPOSITORY"
          [[ "$configured_repository_id" =~ ^[1-9][0-9]*$ ]]
          test "$configured_repository_id" = "$ACTUAL_REPOSITORY_ID"
          test "$(jq -er .githubRepository config/release-distribution.json)" = "$CANONICAL_REPOSITORY"
      - id: requested
        name: Download and independently verify the triggering stable draft
        env:
          CODECADDIE_EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          CODECADDIE_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          CODECADDIE_REQUIRE_COMPLETE_RELEASE: "1"
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > requested-release.json
          test "$(jq -er .target_commitish requested-release.json)" = "$GITHUB_SHA"
          test "$(jq -er .prerelease requested-release.json)" = false
          test "$(jq -er '.assets | map(.name) | length == (unique | length)' requested-release.json)" = true
          requested_is_draft="$(jq -er .draft requested-release.json)"
          if [[ "$requested_is_draft" == false ]]; then
            test "$(jq -er .immutable requested-release.json)" = true
            requested_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq 'select(.object.type == "commit") | .object.sha')"
            test "$requested_tag_sha" = "$GITHUB_SHA"
          fi

          mkdir requested-release
          gh release download "$RELEASE_TAG" --dir requested-release
          node scripts/verify-release-manifest.mjs \
            requested-release/manifest.json \
            requested-release/manifest.sigstore.json \
            "$RELEASE_TAG" \
            requested-release
          test "$(jq -er .sourceCommit requested-release/manifest.json)" = "$GITHUB_SHA"
          requested_version="$(jq -er .version requested-release/manifest.json)"
          requested_build="$(jq -er .build requested-release/manifest.json)"
          printf '%s\n' \
            CodeCaddie-macOS-universal.zip \
            RUST-DEPENDENCY-LICENSES.md \
            SHA256SUMS.txt \
            "codecaddie-$requested_version.cdx.json" \
            dependency-license-exceptions.json \
            manifest.json \
            manifest.sigstore.json \
            release-attestations.jsonl \
            xcode-cloud-provenance.json \
            | sort > requested-expected-assets.txt
          jq -r '.assets[].name' requested-release.json | sort > requested-assets.txt
          cmp requested-expected-assets.txt requested-assets.txt
          while IFS= read -r artifact; do
            if [[ "$artifact" == release-attestations.jsonl ]]; then continue; fi
            gh attestation verify "requested-release/$artifact" \
              --bundle requested-release/release-attestations.jsonl \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done < requested-assets.txt
          {
            echo "build=$requested_build"
            echo "version=$requested_version"
            echo "was_draft=$requested_is_draft"
          } >> "$GITHUB_OUTPUT"
      - id: decision
        name: Verify the published stable high-water mark
        env:
          CODECADDIE_EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          CODECADDIE_REQUIRE_COMPLETE_RELEASE: "1"
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD: ${{ steps.requested.outputs.build }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.requested.outputs.version }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > all-release-pages.json
          jq -r '
            .[][]
            | select(.draft == false and .prerelease == false)
            | .tag_name
          ' all-release-pages.json > published-release-tags.txt

          highest_tag=""
          highest_version=""
          highest_build=""
          while IFS= read -r candidate_tag; do
            if [[ ! "$candidate_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]; then
              continue
            fi
            identity="${candidate_tag#v}"
            candidate_build="${identity##*+}"
            candidate_version="${identity%+*}"
            if [[ -z "$highest_tag" ]]; then
              highest_tag="$candidate_tag"
              highest_version="$candidate_version"
              highest_build="$candidate_build"
              continue
            fi
            comparison="$(node scripts/compare-release-identities.mjs \
              "$candidate_version" "$candidate_build" \
              "$highest_version" "$highest_build")"
            if [[ "$comparison" -gt 0 ]]; then
              highest_tag="$candidate_tag"
              highest_version="$candidate_version"
              highest_build="$candidate_build"
            elif [[ "$comparison" -eq 0 ]]; then
              test "$candidate_tag" = "$highest_tag"
            fi
          done < published-release-tags.txt

          previous_latest_tag=""
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            > previous-latest.json 2>previous-latest-error.txt; then
            previous_latest_tag="$(jq -er .tag_name previous-latest.json)"
          elif ! grep -q '(HTTP 404)' previous-latest-error.txt; then
            cat previous-latest-error.txt >&2
            exit 1
          fi

          publish_as_latest=1
          if [[ -n "$highest_tag" ]]; then
            test "$previous_latest_tag" = "$highest_tag"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$highest_tag" \
              > highest-release.json
            test "$(jq -er '.draft == false and .prerelease == false and .immutable == true' highest-release.json)" = true
            test "$(jq -er '.assets | map(.name) | length == (unique | length)' highest-release.json)" = true
            highest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$highest_tag" \
              --jq 'select(.object.type == "commit") | .object.sha')"
            [[ "$highest_sha" =~ ^[a-f0-9]{40}$ ]]
            test "$(jq -er .target_commitish highest-release.json)" = "$highest_sha"
            mkdir highest-release
            gh release download "$highest_tag" --dir highest-release
            CODECADDIE_EXPECTED_SOURCE_COMMIT="$highest_sha" \
              node scripts/verify-release-manifest.mjs \
                highest-release/manifest.json \
                highest-release/manifest.sigstore.json \
                "$highest_tag" \
                highest-release
            test "$(jq -er .version highest-release/manifest.json)" = "$highest_version"
            test "$(jq -er .build highest-release/manifest.json)" = "$highest_build"
            printf '%s\n' \
              CodeCaddie-macOS-universal.zip \
              RUST-DEPENDENCY-LICENSES.md \
              SHA256SUMS.txt \
              "codecaddie-$highest_version.cdx.json" \
              dependency-license-exceptions.json \
              manifest.json \
              manifest.sigstore.json \
              release-attestations.jsonl \
              xcode-cloud-provenance.json \
              | sort > highest-expected-assets.txt
            jq -r '.assets[].name' highest-release.json | sort > highest-assets.txt
            cmp highest-expected-assets.txt highest-assets.txt
            while IFS= read -r artifact; do
              if [[ "$artifact" == release-attestations.jsonl ]]; then continue; fi
              gh attestation verify "highest-release/$artifact" \
                --bundle highest-release/release-attestations.jsonl \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref refs/heads/main \
                --source-digest "$highest_sha" \
                --deny-self-hosted-runners
            done < highest-assets.txt

            comparison="$(node scripts/compare-release-identities.mjs \
              "$RELEASE_VERSION" "$RELEASE_BUILD" \
              "$highest_version" "$highest_build")"
            if [[ "$comparison" -lt 0 ]]; then
              publish_as_latest=0
            elif [[ "$comparison" -eq 0 ]]; then
              test "$RELEASE_TAG" = "$highest_tag"
            fi
          else
            test -z "$previous_latest_tag"
          fi
          {
            echo "previous_latest_tag=$previous_latest_tag"
            echo "publish_as_latest=$publish_as_latest"
          } >> "$GITHUB_OUTPUT"
      - name: Publish once with the high-water decision in the immutable request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_LATEST_TAG: ${{ steps.decision.outputs.previous_latest_tag }}
          PUBLISH_AS_LATEST: ${{ steps.decision.outputs.publish_as_latest }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq '.enabled == true or .enforced_by_owner == true')" = true
          observed_latest=""
          if ! observed_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq .tag_name 2>observed-latest-error.txt)"; then
            if ! grep -q '(HTTP 404)' observed-latest-error.txt; then
              cat observed-latest-error.txt >&2
              exit 1
            fi
          fi
          test "$observed_latest" = "$PREVIOUS_LATEST_TAG"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > requested-release-before-publication.json
          test "$(jq -er .target_commitish requested-release-before-publication.json)" = "$GITHUB_SHA"
          test "$(jq -er '.assets | map(.name) | length == (unique | length)' requested-release-before-publication.json)" = true
          jq -r '.assets[].name' requested-release-before-publication.json \
            | sort > requested-assets-before-publication.txt
          cmp requested-expected-assets.txt requested-assets-before-publication.txt

          if [[ "$(jq -r .draft requested-release-before-publication.json)" == true ]]; then
            if [[ "$PUBLISH_AS_LATEST" == 1 ]]; then
              gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
            else
              gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=false
            fi
          else
            test "$(jq -er .immutable requested-release-before-publication.json)" = true
          fi

          expected_latest="$PREVIOUS_LATEST_TAG"
          if [[ "$PUBLISH_AS_LATEST" == 1 ]]; then expected_latest="$RELEASE_TAG"; fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$expected_latest"
      - name: Verify public bytes, tag identity, and immutable postconditions
        env:
          CODECADDIE_EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          CODECADDIE_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          CODECADDIE_REQUIRE_COMPLETE_RELEASE: "1"
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > final-release.json
          test "$(jq -er '.draft == false and .prerelease == false and .immutable == true' final-release.json)" = true
          test "$(jq -er .target_commitish final-release.json)" = "$GITHUB_SHA"
          final_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq 'select(.object.type == "commit") | .object.sha')"
          test "$final_tag_sha" = "$GITHUB_SHA"
          jq -r '.assets[].name' final-release.json | sort > final-assets.txt
          cmp requested-expected-assets.txt final-assets.txt

          mkdir public-release
          for name in manifest.json manifest.sigstore.json CodeCaddie-macOS-universal.zip; do
            curl --fail --location --retry 5 --retry-all-errors \
              --connect-timeout 10 --max-time 1800 \
              --output "public-release/$name" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name"
          done
          node scripts/verify-release-manifest.mjs \
            public-release/manifest.json \
            public-release/manifest.sigstore.json \
            "$RELEASE_TAG" \
            public-release
          cmp requested-release/manifest.json public-release/manifest.json
          cmp requested-release/manifest.sigstore.json public-release/manifest.sigstore.json
          cmp requested-release/CodeCaddie-macOS-universal.zip \
            public-release/CodeCaddie-macOS-universal.zip
