name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Branch changes are admitted through pull_request only. Human PRs keep one
  # cancelling lane per PR. Each Dependabot PR gets its own queued lane keyed
  # by base branch and PR number: the backlog is already bounded to one open
  # PR per ecosystem with rebasing disabled, and queuing instead of cancelling
  # means no weekly update can end "cancelled" behind a sibling PR.
  # Protected-main runs use a unique run ID and are never cancelled because
  # the release workflow waits for the exact main-push CI run for each commit.
  group: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && format('{0}-dependabot-{1}-{2}', github.workflow, github.base_ref, github.event.pull_request.number) || github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || github.ref == 'refs/heads/main' && format('{0}-main-{1}', github.workflow, github.run_id) || format('{0}-ref-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') }}

jobs:
  branch-protection:
    name: Protected main release gates
    if: github.ref_name == 'main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify this run targets protected main
        env:
          CODECADDIE_EVENT_NAME: ${{ github.event_name }}
          CODECADDIE_REF_NAME: ${{ github.ref_name }}
          CODECADDIE_BASE_REF: ${{ github.base_ref }}
          CODECADDIE_REF_PROTECTED: ${{ github.ref_protected }}
        run: node scripts/check-protected-ref.mjs

  adversarial-privacy:
    name: Adversarial privacy and prompt-injection gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate the required source-canary surface matrix
        run: node --test scripts/tests/source-canary-matrix.test.mjs
      - name: Validate retention deletion exceptions and serialized-field admission
        run: node --test scripts/tests/privacy-contract-assurance.test.mjs
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - name: Exercise reports, IPC, diagnostics, logs, exports, recovery, and prompts
        run: cargo test --workspace --locked privacy_adversarial -- --nocapture

  ship-readiness:
    name: Ship readiness assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate the executable ship-readiness contract
        run: node --test scripts/tests/ship-readiness.test.mjs
      - name: Exercise saved evidence after a checkout switch
        run: node scripts/exercise-saved-evidence-checkout.mjs
      - name: Exercise product and provider contracts
        run: |
          cargo test -p codecaddie-core --locked privacy_adversarial_runtime_health_and_trace_spans_drive_local_aggregates -- --nocapture
          cargo test -p codecaddie-core --locked product_assurance -- --nocapture
          cargo test -p codecaddie-core --locked every_provider_adapter_conforms_to_valid_malformed_timeout_error_and_no_fallback_cases -- --nocapture
          cargo test -p codecaddie-core --locked provider_timeout_and_cancellation_terminate_descendant_processes -- --nocapture
          cargo test -p codecaddie-core --locked successful_codex_runs_use_only_confined_tools_and_reap_descendants -- --nocapture
          cargo test -p codecaddie-core --locked stream_results_come_from_the_terminal_result_event -- --nocapture
          cargo test -p codecaddie-core --locked provider_failures_are_actionable_without_forwarding_stderr -- --nocapture
          cargo test -p codecaddie-core --locked bounded_provider_omissions_become_unverified_instead_of_losing_the_report -- --nocapture
      - name: Exercise operational fault outcomes
        run: cargo test -p codecaddie-core --locked operational_fault_matrix_proves_metrics_errors_and_alerts_end_to_end -- --nocapture
      - name: Exercise exact-commit snapshot lifecycle
        run: |
          cargo test -p codecaddie-core --locked snapshot_lifecycle_matrix_proves_every_declared_cleanup_path -- --nocapture
          cargo test -p codecaddie-core --locked provider_snapshot_is_exact_commit_read_only_checkout_confined_and_removed -- --nocapture
          cargo test -p codecaddie-core --locked privacy_adversarial_snapshot_cleanup_after_success_failure_and_map_generation -- --nocapture
          cargo test -p codecaddie-core --locked privacy_adversarial_snapshot_cleanup_after_timeout_and_task_cancellation -- --nocapture
          cargo test -p codecaddie-core --locked privacy_adversarial_snapshot_cleanup_recovers_after_restart_without_touching_live_work -- --nocapture
      - name: Exercise persistence recovery boundaries
        run: |
          cargo test -p codecaddie-core --locked interrupted_plaintext_encryption_migration_retries_without_data_loss -- --nocapture
          cargo test -p codecaddie-core --locked fault_injected_atomic_new_retries_converge_across_sync_and_rename_boundaries -- --nocapture
          cargo test -p codecaddie-core --locked fault_injected_replacements_retry_without_losing_the_old_or_new_value -- --nocapture
          cargo test -p codecaddie-core --locked local_state_recovers_interrupted_quarantine_and_stale_sidecars -- --nocapture
          cargo test -p codecaddie-core --locked interrupted_plaintext_event_migration_retries_without_duplicates -- --nocapture
          cargo test -p codecaddie-core --locked fault_injected_append_retries_converge_without_duplicate_records -- --nocapture
          cargo test -p codecaddie-core --locked append_recovers_a_stale_unterminated_tail_before_the_next_record -- --nocapture
          cargo test -p codecaddie-core --locked interrupted_local_state_migrations_converge_before_and_after_rename -- --nocapture
          cargo test -p codecaddie-core --locked storage_capacity_failures_preserve_the_committed_value_for_retry -- --nocapture

  policy:
    name: Policy, version, and installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm version:check
      - run: pnpm brand:check
      - run: node --test scripts/tests/*.test.mjs
      - run: ./scripts/check-public-safety.sh
      - name: Apply the private identifier denylist on trusted events
        if: github.event_name != 'pull_request'
        env:
          PRIVATE_PATTERNS: ${{ secrets.CODECADDIE_PRIVATE_PATTERNS }}
        run: |
          set -euo pipefail
          umask 077
          pattern_file="$RUNNER_TEMP/codecaddie-private-patterns"
          test -n "$PRIVATE_PATTERNS"
          printf '%s\n' "$PRIVATE_PATTERNS" > "$pattern_file"
          CODECADDIE_PRIVATE_PATTERN_FILE="$pattern_file" \
            CODECADDIE_REQUIRE_PRIVATE_PATTERNS=1 \
            ./scripts/check-public-safety.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.25.4"
          cache: false
      # Both Go tools are pinned to the commit SHA behind their release tag so
      # a retargeted tag cannot change what CI executes, matching the SHA
      # pinning applied to every GitHub Action in this workflow.
      - name: Lint GitHub Actions workflows # actionlint v1.7.7
        run: go run github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106
      - name: Scan complete Git history for secrets # gitleaks v8.28.0
        run: go run github.com/zricethezav/gitleaks/v8@4fb43823ef3d152d239e92d7d5cb04783b548062 detect --source . --redact --no-banner
      - name: Reject unrecorded third-party source
        run: |
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          test -s docs/licenses/IBM-PLEX-OFL.txt
          test -s docs/licenses/GEIST-OFL.txt
          test -s docs/licenses/APACHE-2.0.txt
          test -s plugin/LICENSE
          test -s plugin/THIRD_PARTY_NOTICES.md

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - run: cargo fmt --all -- --check
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: Install pinned dependency policy tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-about --version 0.9.1 --locked --features cli
      - run: cargo audit
      - run: cargo deny check licenses
      - name: Generate locked Rust dependency license bundle
        run: |
          cargo about generate scripts/rust-dependency-licenses.hbs --workspace --locked --fail --output-file "$RUNNER_TEMP/RUST-DEPENDENCY-LICENSES.md"
          node scripts/normalize-license-evidence.mjs "$RUNNER_TEMP/RUST-DEPENDENCY-LICENSES.md"
          test -s "$RUNNER_TEMP/RUST-DEPENDENCY-LICENSES.md"
          grep -q 'ed25519-dalek' "$RUNNER_TEMP/RUST-DEPENDENCY-LICENSES.md"
          grep -q 'chacha20poly1305' "$RUNNER_TEMP/RUST-DEPENDENCY-LICENSES.md"
          grep -q 'sigstore-verify' "$RUNNER_TEMP/RUST-DEPENDENCY-LICENSES.md"
          grep -q 'sigstore-tuf' "$RUNNER_TEMP/RUST-DEPENDENCY-LICENSES.md"
          grep -q 'option-ext' "$RUNNER_TEMP/RUST-DEPENDENCY-LICENSES.md"
          cmp docs/licenses/RUST-DEPENDENCY-LICENSES.md "$RUNNER_TEMP/RUST-DEPENDENCY-LICENSES.md"
      - name: Retain dependency license release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-license-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            docs/licenses/RUST-DEPENDENCY-LICENSES.md
            THIRD_PARTY_NOTICES.md
            deny.toml
            about.toml
            config/dependency-license-exceptions.json

  reliability-performance:
    name: Reliability and performance release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-reliability-gates.mjs
      - name: Gate framed core latency, throughput, and capacity
        run: cargo test --release -p codecaddie-core --test performance_gate --locked
      - name: Gate repeatable first-report and provider-execution p95 workloads
        run: |
          cargo test --release -p codecaddie-core --locked repeatable_first_report_load_stays_within_versioned_p95_budget -- --nocapture
          cargo test --release -p codecaddie-core --locked repeatable_provider_execution_load_stays_within_versioned_p95_budget -- --nocapture
      - name: Execute snapshot and disaster recovery cases at production boundaries
        run: pnpm recovery:check
      - name: Execute every supported prior-version binary through upgrade and rollback
        timeout-minutes: 30
        run: node scripts/exercise-supported-prior-binaries.mjs --require-clean
      - name: Enforce the Rust line-coverage floor
        run: |
          cargo install cargo-llvm-cov --version 0.9.0 --locked
          minimum="$(jq -r .quality.minimumRustLineCoveragePercent config/reliability-gates.json)"
          cargo llvm-cov --workspace --locked --fail-under-lines "$minimum"

  clean-bootstrap:
    name: Clean developer bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies from an empty runner cache
        run: pnpm install --frozen-lockfile
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: node scripts/check-reliability-gates.mjs
      - run: cargo test --workspace --locked --no-run

  macos-native:
    name: macOS native (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # The installed journey asserts the build number against
          # `git rev-list --count HEAD`, which is only meaningful on a full
          # history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build --release --package codecaddie-core --locked
      - run: pnpm exec native check apps/desktop --strict
      - run: pnpm exec native test apps/desktop --yes
      - run: pnpm exec native build apps/desktop --yes -Dchannel=dev -Dtrace=off -Dstrip=true
      - name: Independently reproduce macOS build payload
        run: node scripts/verify-reproducible-build.mjs --platform macos --architecture "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducibility-macos-${{ matrix.architecture }}
          if-no-files-found: error
          path: dist/reproducibility/macos-${{ matrix.architecture }}.json
      - name: Package and exercise exact-commit installed journey
        run: |
          ./scripts/package-macos.sh --version 0.3.0-dev --channel dev
          mkdir -p "$HOME/Library/Application Support/CodeCaddie Dev"
          touch "$HOME/Library/Application Support/CodeCaddie Dev/ci-data-sentinel"
          ./scripts/install-local-macos.sh --no-build --no-launch --destination "$RUNNER_TEMP/Applications"
          node scripts/exercise-installed-core.mjs \
            --binary "$RUNNER_TEMP/Applications/CodeCaddie Dev.app/Contents/MacOS/codecaddie-core" \
            --expected-commit "$(git rev-parse HEAD)" \
            --expected-build "$(git rev-list --count HEAD)"
          ./scripts/install-local-macos.sh --no-build --no-launch --destination "$RUNNER_TEMP/Applications"
          ./scripts/install-local-macos.sh --uninstall --destination "$RUNNER_TEMP/Applications"
          test ! -d "$RUNNER_TEMP/Applications/CodeCaddie Dev.app"
          test -f "$HOME/Library/Application Support/CodeCaddie Dev/ci-data-sentinel"

  windows-native-primary:
    name: Windows primary test, build, and package (x64)
    runs-on: windows-2025
    env:
      # link.exe embeds non-reproducible identity unless asked not to; the
      # reproducibility gate compares two clean builds of the same commit.
      RUSTFLAGS: -C link-arg=/Brepro
    steps:
      - name: Disable 8.3 short-name creation so embedded source paths are deterministic
        shell: pwsh
        run: |
          # aws-lc-sys (rustls's crypto provider via reqwest) converts its source
          # paths to 8.3 short names before invoking cl.exe, and NTFS numbers the
          # colliding aws-lc-rs / aws-lc-sys short names by creation order. Without
          # this, the two clean builds embed different __FILE__ strings
          # (AWS-LC~1.0 versus AWS-LC~2.0) and the reproducibility gate fails.
          fsutil 8dot3name set C: 1
          fsutil 8dot3name set D: 1
          fsutil 8dot3name query C:
          fsutil 8dot3name query D:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # setup-zig exports its global and local caches to the same directory,
      # even with action caching disabled. Keep only the expensive compiler
      # objects global; the project-local build graph is deliberately isolated.
      - name: Isolate the Windows Zig warm-up cache
        shell: pwsh
        run: |
          $warmLocal = Join-Path $env:RUNNER_TEMP "codecaddie-zig-warm-local"
          New-Item -ItemType Directory -Force $warmLocal | Out-Null
          "ZIG_LOCAL_CACHE_DIR=$warmLocal" >> $env:GITHUB_ENV
      - name: Bind the exact Windows build identity
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          $commit = (git rev-parse HEAD)
          if ($commit -ne $env:EXPECTED_COMMIT) { throw "checkout does not match the requested commit" }
          "CODECADDIE_COMMIT_SHA=$commit" >> $env:GITHUB_ENV
          "CODECADDIE_BUILD_NUMBER=$(git rev-list --count HEAD)" >> $env:GITHUB_ENV
      - run: cargo build --release --package codecaddie-core --locked
      # The exact prior Windows runner succeeded after native tests populated
      # the isolated Zig cache, while a later fully cold ReleaseFast compile
      # exhausted LLVM memory. Keep the cache job-local, warm it explicitly,
      # then serialize the application build graph from a fresh local cache.
      # Native CLI intentionally forwards only -D flags, so direct Zig is
      # required for the -j1 memory bound.
      - name: Serialize the primary native test warm-up
        working-directory: apps/desktop
        run: zig build test --summary all -Dchannel=dev -Dcpu=baseline -j1
      - name: Reset the primary release-local Zig graph
        shell: pwsh
        run: |
          $releaseLocal = Join-Path $env:RUNNER_TEMP "codecaddie-zig-release-local"
          if (Test-Path $releaseLocal) { Remove-Item -Recurse -Force $releaseLocal }
          if (Test-Path "apps\desktop\zig-out") { Remove-Item -Recurse -Force "apps\desktop\zig-out" }
          New-Item -ItemType Directory -Force $releaseLocal | Out-Null
          "ZIG_LOCAL_CACHE_DIR=$releaseLocal" >> $env:GITHUB_ENV
      - name: Serialize the primary native build graph
        working-directory: apps/desktop
        run: zig build --summary all -Doptimize=ReleaseFast -Dchannel=dev -Dtrace=off -Dstrip=true -Dcpu=baseline -j1
      - name: Capture primary Windows build payload
        run: >-
          node scripts/verify-reproducible-build.mjs
          --mode capture
          --platform windows
          --architecture x64
          --output dist/reproducibility/windows-x64-primary.json
      - name: Retain primary Windows release executables for reproducibility diagnosis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-primary-executables
          if-no-files-found: error
          retention-days: 3
          path: |
            target/release/codecaddie-core.exe
            target/release/codecaddie-updater.exe
      - name: Package captured exact-commit Windows build
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version 0.3.0-dev -Channel dev -UseExistingBuild
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducibility-windows-x64-primary
          if-no-files-found: error
          retention-days: 3
          path: dist/reproducibility/windows-x64-primary.json
      # These remain release gates, but run after capture so their generated
      # files and caches cannot influence only one side of the comparison.
      - run: cargo test --workspace --locked
      - run: pnpm exec native check apps/desktop --strict
      - name: Exercise exact-commit installed journey
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "Programs\CodeCaddie Dev"
          $data = Join-Path $env:APPDATA "CodeCaddie Dev"
          New-Item -ItemType Directory -Force $data | Out-Null
          New-Item -ItemType File -Force (Join-Path $data "ci-data-sentinel") | Out-Null
          ./scripts/install-local-windows.ps1 -NoBuild -NoLaunch -Destination $destination
          $core = Join-Path $destination "bin\codecaddie-core.exe"
          $commit = (git rev-parse HEAD)
          $build = (git rev-list --count HEAD)
          node scripts/exercise-installed-core.mjs --binary $core --expected-commit $commit --expected-build $build
          ./scripts/install-local-windows.ps1 -NoBuild -NoLaunch -Destination $destination
          ./scripts/install-local-windows.ps1 -Uninstall -Destination $destination
          if (Test-Path $destination) { throw "developer application remained after uninstall" }
          if (-not (Test-Path (Join-Path $data "ci-data-sentinel"))) { throw "developer data was removed" }

  windows-native-independent:
    name: Windows independent clean build (x64)
    runs-on: windows-2025
    env:
      # link.exe embeds non-reproducible identity unless asked not to; the
      # reproducibility gate compares two clean builds of the same commit.
      RUSTFLAGS: -C link-arg=/Brepro
    steps:
      - name: Disable 8.3 short-name creation so embedded source paths are deterministic
        shell: pwsh
        run: |
          # aws-lc-sys (rustls's crypto provider via reqwest) converts its source
          # paths to 8.3 short names before invoking cl.exe, and NTFS numbers the
          # colliding aws-lc-rs / aws-lc-sys short names by creation order. Without
          # this, the two clean builds embed different __FILE__ strings
          # (AWS-LC~1.0 versus AWS-LC~2.0) and the reproducibility gate fails.
          fsutil 8dot3name set C: 1
          fsutil 8dot3name set D: 1
          fsutil 8dot3name query C:
          fsutil 8dot3name query D:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Isolate the Windows Zig warm-up cache
        shell: pwsh
        run: |
          $warmLocal = Join-Path $env:RUNNER_TEMP "codecaddie-zig-warm-local"
          New-Item -ItemType Directory -Force $warmLocal | Out-Null
          "ZIG_LOCAL_CACHE_DIR=$warmLocal" >> $env:GITHUB_ENV
      - name: Bind the exact Windows build identity
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          $commit = (git rev-parse HEAD)
          if ($commit -ne $env:EXPECTED_COMMIT) { throw "checkout does not match the requested commit" }
          "CODECADDIE_COMMIT_SHA=$commit" >> $env:GITHUB_ENV
          "CODECADDIE_BUILD_NUMBER=$(git rev-list --count HEAD)" >> $env:GITHUB_ENV
      - run: cargo build --release --package codecaddie-core --locked
      - name: Serialize the independent native test warm-up
        working-directory: apps/desktop
        run: zig build test --summary all -Dchannel=dev -Dcpu=baseline -j1
      - name: Reset the independent release-local Zig graph
        shell: pwsh
        run: |
          $releaseLocal = Join-Path $env:RUNNER_TEMP "codecaddie-zig-release-local"
          if (Test-Path $releaseLocal) { Remove-Item -Recurse -Force $releaseLocal }
          if (Test-Path "apps\desktop\zig-out") { Remove-Item -Recurse -Force "apps\desktop\zig-out" }
          New-Item -ItemType Directory -Force $releaseLocal | Out-Null
          "ZIG_LOCAL_CACHE_DIR=$releaseLocal" >> $env:GITHUB_ENV
      - name: Serialize the independent native build graph
        working-directory: apps/desktop
        run: zig build --summary all -Doptimize=ReleaseFast -Dchannel=dev -Dtrace=off -Dstrip=true -Dcpu=baseline -j1
      - name: Capture independent Windows build payload
        run: >-
          node scripts/verify-reproducible-build.mjs
          --mode capture
          --platform windows
          --architecture x64
          --output dist/reproducibility/windows-x64-independent.json
      - name: Retain independent Windows release executables for reproducibility diagnosis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-independent-executables
          if-no-files-found: error
          retention-days: 3
          path: |
            target/release/codecaddie-core.exe
            target/release/codecaddie-updater.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducibility-windows-x64-independent
          if-no-files-found: error
          retention-days: 3
          path: dist/reproducibility/windows-x64-independent.json

  windows-native:
    name: Windows native (x64)
    needs: [windows-native-primary, windows-native-independent]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed unless both Windows builds succeeded
        env:
          INDEPENDENT_RESULT: ${{ needs.windows-native-independent.result }}
          PRIMARY_RESULT: ${{ needs.windows-native-primary.result }}
        run: |
          test "$PRIMARY_RESULT" = success
          test "$INDEPENDENT_RESULT" = success
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: reproducibility-windows-x64-primary
          path: dist/reproducibility/primary
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: reproducibility-windows-x64-independent
          path: dist/reproducibility/independent
      - name: Compare exact-commit Windows payloads
        run: >-
          node scripts/verify-reproducible-build.mjs
          --mode compare
          --platform windows
          --architecture x64
          --expected-commit "${{ github.sha }}"
          --first dist/reproducibility/primary/windows-x64-primary.json
          --second dist/reproducibility/independent/windows-x64-independent.json
          --output dist/reproducibility/windows-x64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducibility-windows-x64
          if-no-files-found: error
          retention-days: 3
          path: dist/reproducibility/windows-x64.json
