name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Require Signed-off-by on every pull-request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDABOT_EMAIL: 49699333+dependabot[bot]@users.noreply.github.com
        run: |
          failed=0
          while read -r commit; do
            # Dependabot's version bumps are generated, not contributed; the
            # maintainer's review and squash merge stand in for the sign-off.
            if [ "$(git show -s --format=%ae "$commit")" = "$DEPENDABOT_EMAIL" ]; then
              echo "Skipping automated Dependabot commit $commit"
              continue
            fi
            if ! git show -s --format=%B "$commit" | git interpret-trailers --parse | grep -qi '^Signed-off-by:'; then
              echo "::error::Commit $commit has no Signed-off-by trailer"
              failed=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$failed"
