[workspace]
members = ["crates/codecaddie-domain", "crates/codecaddie-core"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/tailored-ai-solutions/codecaddie"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = { version = "0.5.3", features = ["zeroize"] }
base64 = "0.22.1"
blake3 = "1.8.2"
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
hex = "0.4.3"
futures-util = "0.3.33"
fs2 = "0.4.3"
jiff = { version = "0.2.16", features = ["serde"] }
libc = "0.2.177"
lopdf = { version = "0.44.0", default-features = false }
plist = "1.10.0"
quick-xml = "0.42.0"
rand = "0.8.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
sigstore-tuf = { version = "0.11.0", default-features = false, features = ["rustls"] }
sigstore-verify = { version = "0.11.0", default-features = false, features = ["rustls", "tuf"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "serde", "serde-well-known"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v7"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
zip = { version = "8.0.0", default-features = false, features = ["deflate"] }
zeroize = "1.8.2"

[profile.release]
lto = "off"
codegen-units = 1
strip = "symbols"
